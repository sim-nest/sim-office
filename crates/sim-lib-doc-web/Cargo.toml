[package]
name = "sim-lib-doc-web"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "Durable web-capture evidence adapters for SIM office documents."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-office"
homepage = "https://github.com/sim-nest/sim-office"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-codec-doc = { version = "0.3.0" }
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-lib-doc-core = { version = "0.2.0", path = "../sim-lib-doc-core" }
sim-lib-doc-store = { version = "0.2.0", path = "../sim-lib-doc-store" }
sim-lib-web-core = { version = "0.2.0" }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[dev-dependencies]
sim-lib-net-core = { version = "0.4.0" }
tempfile = "3"

[lints]
workspace = true
