[package]
name = "sim-site-libreoffice"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "LibreOffice helper-process site for SIM office documents."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-office"
homepage = "https://github.com/sim-nest/sim-office"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-deck = { version = "0.1.0", path = "../sim-lib-deck" }
sim-lib-doc-core = { version = "0.1.0", path = "../sim-lib-doc-core" }
sim-lib-doc-site = { version = "0.1.0", path = "../sim-lib-doc-site" }
sim-lib-exec = { version = "0.2.0" }
sim-lib-sheet = { version = "0.1.0", path = "../sim-lib-sheet" }
sim-transport-ports = { version = "0.1.0" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[lints]
workspace = true
