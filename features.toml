schema = "sim.features"

[enforcement.audience]
user = "strict"
code = "strict"
framework = "advisory"

[enforcement.surface]
cli = "strict"
view = "strict"
docs = "advisory"
syntax = "strict"
wire = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-office/generated-docs"
title = "Repository documentation surface"
summary = "Publish generated package, card, recipe, and index facts for office documents, sites, and codecs."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this row when checking the generated documentation and index lane for the office repo."
claims_anchors = [
  "anchor/cli/xtask",
  "anchor/crate/xtask",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/sim-index-fragment",
]
claims_surfaces = [
  "cli/xtask",
  "docs/sim-office/generated",
]

[[feature]]
id = "feature/sim-office/document-codecs"
title = "Document codec workflows"
summary = "Round-trip OOXML, ODF, deck, sheet, and markup documents through office codec recipes."
owner = "crate/sim-lib-office-pack"
audiences = ["user", "code"]
guidance = "Use this row when choosing a document codec or checking that an office file round-trips."
claims_anchors = [
  "anchor/crate/sim-codec-odf",
  "anchor/crate/sim-codec-ooxml",
  "anchor/crate/sim-lib-doc-markup",
  "anchor/crate/sim-lib-office-pack",
  "anchor/export/sim-codec-odf/codec/odf",
  "anchor/export/sim-codec-ooxml/codec/ooxml-pptx",
  "anchor/export/sim-codec-ooxml/codec/ooxml-xlsx",
  "anchor/export/sim-lib-doc-markup/codec/markup-doc/asciidoc",
  "anchor/export/sim-lib-doc-markup/codec/markup-doc/latex",
  "anchor/export/sim-lib-doc-markup/codec/markup-doc/markdown",
  "anchor/export/sim-lib-doc-markup/codec/markup-doc/typst",
  "anchor/export/sim-lib-doc-markup/codec/markup-doc/unknown",
  "anchor/grammar/syntax/odf",
  "anchor/grammar/syntax/ooxml",
]
claims_surfaces = [
  "syntax/odf",
  "syntax/ooxml",
]
claims_specimens = [
  "spec-test/sim-office/crates/sim-codec-odf/src/tests",
]

[[feature]]
id = "feature/sim-office/document-surfaces"
title = "Document view surfaces"
summary = "Project document, markup, and suite descriptors into view surfaces for review and editing."
owner = "crate/sim-lib-doc-surface"
audiences = ["user", "code", "framework"]
guidance = "Use this row when rendering an office document or suite preview."
claims_anchors = [
  "anchor/crate/sim-lib-deck",
  "anchor/crate/sim-lib-doc-core",
  "anchor/crate/sim-lib-doc-ledger",
  "anchor/crate/sim-lib-doc-surface",
  "anchor/export/sim-lib-doc-surface/view-default",
]
claims_surfaces = [
  "view/sim-lib-doc-core",
  "view/sim-lib-doc-markup",
  "view/sim-lib-doc-surface",
]
claims_specimens = [
  "spec-test/sim-office/crates/sim-lib-doc-surface/src/scene",
]

[[feature]]
id = "feature/sim-office/document-store"
title = "Relational document store consumer"
summary = "Persist document, edit, evidence, and web-provenance projections through checked relational plans while adopting the exact legacy file layout."
owner = "crate/sim-lib-doc-store"
audiences = ["code"]
guidance = "Use this thin consumer for office projection persistence. It composes the relation schema, plan, site, and SQLite capsule contracts; do not add document-specific SQL, provider handles, query builders, migrations, or driver adapters."
claims_anchors = ["anchor/crate/sim-lib-doc-store"]
claims_specimens = [
  "recipe/sim-office/crates/sim-lib-doc-store/01-basics/doc-store-projection",
  "recipe/sim-office/crates/sim-lib-doc-store/01-basics/evidence-fact-graph",
]

[[feature]]
id = "feature/sim-office/web-evidence"
title = "Captured web evidence"
summary = "Bind offline captures and legally supplied editions to normalized representations and verified Unicode spans for durable citations and parallel reading."
owner = "crate/sim-lib-doc-web"
audiences = ["user", "code", "framework"]
guidance = "Use this adapter after neutral capture/decoding or offline legal supply. It reuses office Evidence, DocStore, immutable WebRepresentation, and EvidenceSelector identities; edition admission adds licence ceilings, expiry, layered annotations, removal, and rebuildable indexes without fetching, rematching quotes, or trusting provider snippets."
claims_anchors = [
  "anchor/crate/sim-lib-doc-core",
  "anchor/crate/sim-lib-doc-store",
  "anchor/crate/sim-lib-doc-web",
]
claims_specimens = [
  "recipe/sim-office/crates/sim-lib-doc-web/01-basics/capture-to-citation",
  "recipe/sim-office/crates/sim-lib-doc-web/01-basics/parallel-reading",
  "spec-test/sim-office/crates/sim-lib-doc-web/src/tests",
]

[[feature]]
id = "feature/sim-office/sheet-calculation"
title = "Sheet calculation"
summary = "Evaluate local sheet formulas over exact rational cells with incremental dependency tracking and cutoff."
owner = "crate/sim-lib-sheet"
audiences = ["user", "code", "framework"]
guidance = "Use this row when calculating local sheet formulas or reusing exact sheet dependencies across repeated edits."
claims_anchors = [
  "anchor/crate/sim-lib-sheet",
  "anchor/card/cookbook/office/sheet",
  "anchor/rustdoc/sim-lib-sheet/eval_formula",
  "anchor/rustdoc/sim-lib-sheet/sheet-formula-engine",
]
claims_specimens = [
  "spec-test/sim-office/crates/sim-lib-sheet/src/tests",
]

[[feature]]
id = "feature/sim-office/office-site-workflows"
title = "Office site workflows"
summary = "Run portable document, mail, Graph, SharePoint, and LibreOffice workflows over modeled or explicitly supplied platform ports."
owner = "crate/sim-lib-doc-site"
audiences = ["user", "code"]
guidance = "Keep ODF, Doc, Sheet, Deck, Gantt, surface, and site policy here. The document and Gantt stores independently compose checked relation schemas, plans, opaque preopened placement, and closure-managed transactions; product crates retain ordering, conversion, and error semantics while the SQLite capsule alone owns SQL. Compose LibreOffice with supplied mounts plus ProcessPort or IpcPort, and Graph with a supplied GraphPort; use modeled services in portable tests and platform capsule evidence for physical helpers, sockets, TLS, and local IPC."
claims_anchors = [
  "anchor/crate/sim-lib-doc-site",
  "anchor/crate/sim-lib-doc-store",
  "anchor/crate/sim-lib-gantt",
  "anchor/crate/sim-lib-mail",
  "anchor/crate/sim-site-libreoffice",
  "anchor/crate/sim-site-msgraph",
  "anchor/crate/sim-site-sharepoint",
  "anchor/export/sim-lib-mail/site/msgraph",
  "anchor/export/sim-site-libreoffice/site/libreoffice",
  "anchor/export/sim-site-msgraph/site/msgraph",
  "anchor/export/sim-site-sharepoint/site/sharepoint",
]
claims_specimens = [
  "spec-test/sim-office/crates/sim-lib-doc-site/src/register_tests",
]

[[route]]
id = "route/review-office-document"
task = "Review an office document"
audiences = ["user", "code"]
steps = [
  { feature = "feature/sim-office/document-codecs", why = "The codec row chooses the file format and round-trip path." },
  { feature = "feature/sim-office/document-surfaces", why = "The surface row renders the document into a reviewable view." },
  { feature = "feature/sim-office/office-site-workflows", why = "The site row connects the document to modeled workplace sources." },
  { specimen = "recipe/sim-office/crates/sim-lib-doc-surface/01-basics/suite-surface-descriptor", why = "The suite-surface recipe is the shortest surface example." },
]

[[route]]
id = "route/web-capture-to-office-evidence"
task = "Trace an office citation to its raw web capture and policy receipt"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-office/web-evidence", why = "The evidence adapter binds the citation to checked capture and representation ids while retaining the policy receipt." },
  { specimen = "recipe/sim-office/crates/sim-lib-doc-web/01-basics/capture-to-citation", why = "The offline recipe shows the capture, representation, anchor, reload, and citation path without network access." },
  { specimen = "spec-test/sim-office/crates/sim-lib-doc-web/src/tests", why = "The checked tests prove restart stability and fail-closed behavior for tampered capture, representation, selector, index, and codec metadata." },
]

[[route]]
id = "route/calculate-sheet"
task = "Calculate a sheet"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-office/sheet-calculation", why = "The sheet row binds sparse cells and exact formula syntax to the incremental core." },
  { specimen = "recipe/sim-office/crates/sim-lib-sheet/01-basics/exact-sheet-formula", why = "The recipe shows exact rational formula input and output." },
  { specimen = "spec-test/sim-office/crates/sim-lib-sheet/src/tests", why = "The checked tests exercise invalidation, cycle paths, cutoff, and repeated-edit parity." },
]
